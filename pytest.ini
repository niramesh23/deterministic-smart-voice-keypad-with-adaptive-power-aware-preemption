[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = .
markers =
    hardware: tests requiring physical audio hardware (microphone)
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning:sounddevice
